<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JW-市場研究報告</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171a21'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3EJW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f2430;
    --ink: #e8e9ec;
    --ink-2: #b4b8c0;
    --ink-3: #8a8f99;
    --line: #2a2f3a;
    --accent: #6ea8ff;
    --accent-soft: #1a2a44;
    --html: #4cc38a;
    --html-soft: #12301f;
    --pdf: #ff8a6b;
    --pdf-soft: #3a1c14;
    --warn: #ffb020;
    --warn-bg: #2b1f08;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  a { color: var(--accent); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 16px 64px; }

  header .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 10px;
  }
  header h1 { font-size: 32px; line-height: 1.25; margin: 0 0 16px; font-weight: 700; }
  .notice {
    display: flex; align-items: center; gap: 14px;
    background: var(--warn-bg); border: 2px solid var(--warn); border-left-width: 10px;
    border-radius: 10px; padding: 16px 20px; margin: 0 0 8px;
    color: var(--warn); font-size: 22px; font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 0 0 1px rgba(255,176,32,.15), 0 8px 24px rgba(0,0,0,.35);
  }
  .notice .icon { font-size: 30px; line-height: 1; }
  .notice small { display: block; font-size: 13px; font-weight: 400; color: #f3d9a4; margin-top: 2px; letter-spacing: 0; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 36px 0 14px; }
  .search {
    flex: 1 1 240px; min-width: 0;
    font: inherit; font-size: 15px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0f1115; }

  .count { font-size: 13px; color: var(--ink-3); margin: 0 0 8px; }

  ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li.item { border-bottom: 1px solid var(--line); }
  li.item a {
    display: grid; grid-template-columns: 96px 1fr auto; gap: 4px 20px;
    padding: 18px 8px; color: inherit; text-decoration: none; border-radius: 6px;
  }
  li.item a:hover { background: var(--surface); }
  li.item a:hover .title { color: var(--accent); }
  .date { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--ink-3); padding-top: 3px; }
  .title { font-size: 17px; font-weight: 700; margin: 0 0 4px; line-height: 1.4; }
  .summary { margin: 0 0 8px; color: var(--ink-2); font-size: 14.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 4px; }
  .fmt {
    align-self: start; margin-top: 2px;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; font-weight: 500;
    padding: 2px 8px; border-radius: 4px; white-space: nowrap;
  }
  .fmt.html { color: var(--html); background: var(--html-soft); }
  .fmt.pdf  { color: var(--pdf);  background: var(--pdf-soft); }
  .empty { padding: 32px 8px; color: var(--ink-3); text-align: center; }

  footer { margin-top: 48px; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 14px; }
  footer p { margin: 0 0 4px; }

  @media (max-width: 600px) {
    .wrap { padding-top: 36px; }
    header h1 { font-size: 26px; }
    .notice { font-size: 18px; padding: 12px 14px; }
    li.item a { grid-template-columns: 1fr auto; padding: 16px 4px; }
    .date { grid-column: 1 / -1; order: -1; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Market Research Reports · AI generated</p>
    <h1>JW-市場研究報告</h1>
    <div class="notice" role="alert"><span class="icon">⚠</span><div>全部內容由AI生成，僅供參考！<small>所有報告皆由 AI 自動蒐集、整理與撰寫，未經人工逐筆核對；數據與結論請以原始來源為準。</small></div></div>
  </header>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="搜尋標題、摘要或標籤…" aria-label="搜尋報告">
    <div class="chips" id="chips" role="group" aria-label="依標籤篩選"></div>
  </div>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>

  <footer>
    <p id="updated"></p>
    <p>本站所有內容由 AI 生成，僅供參考，不構成任何建議。</p>
  </footer>
</div>

<script>
// ===== 報告清單：新增報告只要在最前面加一筆 =====
// 日期格式固定為 YYYY-MM-DD（例：2026-10-16），零補位、不可省略。
// 同一格式同時用於：date 欄位、標題尾端的日期後綴（例「台灣 Signal Integrity 職缺總覽 2026-10-16」）、
// 以及資料夾名 reports/<YYYY-MM-DD>_<slug>/。重新抓取／改版同一主題時，新增一筆新日期的項目，標題主體不變、只換日期。
const REPORTS = [
  {
    date: "2026-10-16",
    title: "台灣 Signal Integrity 職缺總覽 2026-10-16",
    summary: "2026-10-16 抓取 104、LinkedIn、公司官網、levels.fyi、Indeed、Cake、Yourator、Glassdoor 的台灣 SI / SI-PI / 高速訊號職缺 1,311 筆：外商／台商分類、產業類型、縣市與 Google 地圖、完整 JD 原文、重點與評論、北台灣據點地圖。",
    tags: ["SI", "職缺", "市場研究"],
    format: "html",
    href: "reports/2026-10-16_taiwan-si-jobs/"
  }
];
</script>
<script>
(function () {
  const list = document.getElementById("list");
  const q = document.getElementById("q");
  const chipsEl = document.getElementById("chips");
  const countEl = document.getElementById("count");
  let activeTag = null;

  const sorted = REPORTS.slice().sort((a, b) => b.date.localeCompare(a.date));
  const tags = [...new Set(sorted.flatMap(r => r.tags))];

  function chip(label, tag) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(activeTag === tag));
    b.onclick = () => { activeTag = activeTag === tag ? null : tag; renderChips(); render(); };
    return b;
  }
  function renderChips() {
    chipsEl.replaceChildren(chip("全部", null), ...tags.map(t => chip(t, t)));
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function render() {
    const term = q.value.trim().toLowerCase();
    const rows = sorted.filter(r =>
      (!activeTag || r.tags.includes(activeTag)) &&
      (!term || [r.title, r.summary, ...r.tags].join(" ").toLowerCase().includes(term))
    );
    list.replaceChildren(...rows.map(r => {
      const li = el("li", "item");
      const a = el("a");
      a.href = r.href;
      a.target = "_blank"; a.rel = "noopener";
      const body = el("div");
      body.append(el("p", "title", r.title), el("p", "summary", r.summary));
      const tg = el("div", "tags");
      r.tags.forEach(t => tg.append(el("span", "tag", t)));
      body.append(tg);
      a.append(el("span", "date", r.date), body, el("span", "fmt " + r.format, r.format.toUpperCase()));
      li.append(a);
      return li;
    }));
    if (!rows.length) list.append(el("li", "empty", "沒有符合的報告"));
    countEl.textContent = `共 ${rows.length} 份報告`;
  }

  document.getElementById("updated").textContent = "最後更新：" + (sorted[0] ? sorted[0].date : "—");
  q.addEventListener("input", render);
  renderChips(); render();
})();
</script>
</body>
</html>
